 box-shadow:0 4px 16px rgba(0,0,0,0.08);

    .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-bottom:24px}
    .controls.four{grid-template-columns:repeat(4,1fr)}
    .control-group{display:flex;flex-direction:column}
    label{font-weight:bold;font-size:22px;margin-bottom:10px;color:#1e293b}

    .btn-success:hover{background:#15803d;transform:translateY(-2px);box-shadow:0 5px 15px rgba(22,163,74,0.3)}
    .btn-secondary{background:#6366f1;color:white}
    .btn-secondary:hover{background:#4f46e5;transform:translateY(-2px);box-shadow:0 5px 15px rgba(99,102,241,0.3)}

    .grid{display:grid;gap:8px;margin-top:20px}

    .info-box{background:#dbeafe;border-left:5px solid #06C755;padding:20px;border-radius:8px;margin:20px 0}

<script>

function toggleCharacterType(){
  const mode = document.getElementById("generateMode").value;
  const group = document.getElementById("characterTypeGroup");

  if(mode === "AI直接生成"){
    group.style.display = "flex";
  } else {
    group.style.display = "none";
  }
}

function generateStaticPrompt(){

  const mode = document.getElementById("generateMode").value;
  const characterType = document.getElementById("characterType").value;
  const style = document.getElementById("style").value;
  const theme = document.getElementById("theme").value;
  const fontStyle = document.getElementById("fontStyle").value;
  const backgroundType = document.getElementById("backgroundType").value;

  const countInfo = document.getElementById("stickerCount").value.split("|");
  const stickerCount = countInfo[0];
  const gridLayout = countInfo[1];

  let characterText = "";

  if(mode === "AI直接生成"){
    characterText = `
主角類型：
${characterType}

請依主角類型自行設計適合的可愛角色。
`;
  } else {
    characterText = `


請依照上傳圖片中的角色進行設計，
保持人物造型、髮型、服裝、配色與整體風格一致。
`;
  }

  const prompt = `
請生成 LINE貼圖風格圖片。

生成方式：
${mode}

${characterText}

風格：
${style}

主題：
${theme}

文字風格：
${fontStyle}

背景處理方式：
${backgroundType}

貼圖數量：
${stickerCount} 張

排列方式：
請以 ${gridLayout} 宮格排列輸出。

每一格都是一張獨立貼圖，
角色置中，
四周保留適當留白，
線條清楚，
表情明顯，
文字清楚好讀，
適合手機小畫面觀看，
適合後續裁切成 LINE 靜態貼圖。

如果背景選擇「公版淺灰背景（推薦）」，
請使用乾淨淺灰色背景，
方便後續去背處理。

請完整輸出 ${stickerCount} 張貼圖，
不要少圖，
不要重複同一張。
`;

  document.getElementById("output").value = prompt;
}
function generateMotionPrompt(){

  const motion = document.getElementById("motion").value;

  const prompt = `
請依上傳的角色，
設計成LINE動態貼圖風格。

請生成「3×2 動畫分鏡總表」，
共6格連續動作，
依照「${motion}」動作進行拆解。

每格保持角色一致性，
維持相同服裝、配色與風格。

每格只做小幅度變化，
讓動畫自然流暢。

第一格與最後一格動作接近，
方便後續自然循環播放。

適合LINE動態貼圖使用，
角色置中，
四周保留適當留白，
線條清楚，
表情明顯，
適合後續裁切成LINE動態貼圖影格。

請以完整3×2宮格方式排列輸出。
`;

  document.getElementById("output").value = prompt;
}

function copyPrompt(){

  const output = document.getElementById("output");

  output.select();
  output.setSelectionRange(0, 99999);

  navigator.clipboard.writeText(output.value);

  alert("📋 咒語已複製！");
}
