<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE 動態貼圖 APNG 製作工具 - 支援大圖裁切</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/1.0.11/pako.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .drop-zone { border: 2px dashed #e2e8f0; transition: all 0.3s ease; }
        .drop-zone.active { border-color: #00c300; background-color: #f0fff0; }
        .line-green { color: #00c300; }
        .bg-line-green { background-color: #00c300; }
        .check-item.valid { color: #059669; }
        .check-item.invalid { color: #dc2626; }
        .modal { backdrop-filter: blur(4px); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <div class="max-w-6xl mx-auto py-8 px-4">
        <!-- Header -->
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">LINE 動態貼圖製作 <span class="text-sm font-normal text-gray-400">v2.0</span></h1>
                <p class="text-gray-500 mt-1 text-sm">支援單圖上傳與「大圖自動裁切」功能</p>
            </div>
            <div class="flex gap-2">
                <button id="sliceModeBtn" class="bg-blue-50 text-blue-600 border border-blue-200 px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-100 transition-colors">
                    ✂️ 大圖裁切模式
                </button>
                <div class="bg-line-green text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm">
                    符合 LINE 規範
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left: List -->
            <div class="lg:col-span-2 space-y-4">
                <div id="dropZone" class="drop-zone bg-white rounded-2xl p-10 text-center cursor-pointer shadow-sm">
                    <input type="file" id="fileInput" class="hidden" accept="image/png" multiple>
                    <div class="flex flex-col items-center">
                        <svg class="w-12 h-12 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        <p class="text-lg font-bold text-gray-700">點擊或拖放單張/多張 PNG 圖片</p>
                        <p class="text-sm text-gray-400 mt-2">若要裁切整張序列圖，請使用右上方「大圖裁切模式」</p>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="p-4 border-b flex justify-between items-center bg-gray-50/50">
                        <h2 class="font-bold text-gray-700">影格序列 (<span id="frameCount">0</span>/20)</h2>
                        <button id="clearBtn" class="text-sm text-gray-400 hover:text-red-500 transition-colors">全部清空</button>
                    </div>
                    <div id="frameList" class="p-4 space-y-2 max-h-[500px] overflow-y-auto min-h-[120px]">
                        <!-- Frames -->
                    </div>
                </div>
            </div>

            <!-- Right: Settings & Validation -->
            <div class="space-y-6">
                <!-- Validation -->
                <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
                    <h2 class="font-bold text-gray-800 mb-4">規範檢查</h2>
                    <ul class="space-y-3 text-sm" id="checklist">
                        <li class="check-item invalid flex items-center gap-2" data-rule="count">
                            <span class="status-icon">❌</span> 影格數需 5~20 張
                        </li>
                        <li class="check-item invalid flex items-center gap-2" data-rule="time">
                            <span class="status-icon">❌</span> 總時長需為 1, 2, 3 或 4 秒
                        </li>
                        <li class="check-item invalid flex items-center gap-2" data-rule="size">
                            <span class="status-icon">❌</span> 檔案需小於 300 KB
                        </li>
                    </ul>
                </div>

                <!-- Settings -->
                <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
                    <h2 class="font-bold text-gray-800 mb-4">動畫設定</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">每格時長 (ms)</label>
                            <input type="number" id="frameDelay" value="100" min="50" step="10" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                            <p class="text-xs text-gray-400 mt-1">目前總長：<span id="totalDurationDisplay" class="font-bold">0</span> 秒</p>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">播放次數 (Loop)</label>
                            <select id="loopCount" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                                <option value="1">1 次</option>
                                <option value="2">2 次</option>
                                <option value="3">3 次</option>
                                <option value="4" selected>4 次 (預設)</option>
                            </select>
                        </div>

                        <button id="generateBtn" class="w-full bg-line-green hover:bg-green-600 text-white font-bold py-3 rounded-xl transition-all shadow-md">
                            產生動畫並檢查
                        </button>
                    </div>
                </div>

                <!-- Preview Area -->
                <div id="previewCard" class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100 hidden">
                    <h2 class="font-bold text-gray-800 mb-4">產出預覽</h2>
                    <div class="aspect-[320/270] bg-gray-100 rounded-lg flex items-center justify-center overflow-hidden border">
                        <img id="resultImage" class="max-w-full max-h-full object-contain">
                    </div>
                    <div class="mt-4 space-y-2">
                        <div class="flex justify-between text-xs">
                            <span class="text-gray-500">檔案大小:</span>
                            <span id="finalSize" class="font-bold">0 KB</span>
                        </div>
                        <button id="downloadBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg transition-all">
                            下載 APNG
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Slicing Modal -->
    <div id="sliceModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 hidden modal p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden">
            <div class="p-6 border-b flex justify-between items-center">
                <h3 class="text-xl font-bold text-gray-800">✂️ 大圖裁切精靈</h3>
                <button id="closeModal" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            <div class="p-6 space-y-6">
                <div class="flex flex-col items-center justify-center border-2 border-dashed border-gray-100 rounded-xl p-4 bg-gray-50 min-h-[200px]">
                    <input type="file" id="sliceInput" class="hidden" accept="image/png">
                    <div id="slicePreviewContainer" class="hidden w-full overflow-auto max-h-[300px] border rounded bg-white relative">
                        <img id="sliceTargetImg" class="block mx-auto">
                        <div id="gridOverlay" class="absolute inset-0 pointer-events-none"></div>
                    </div>
                    <button id="selectSliceFileBtn" class="px-6 py-2 bg-white border border-gray-200 rounded-lg shadow-sm font-medium hover:bg-gray-50">選擇大圖檔案</button>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">水平分割 (欄)</label>
                        <input type="number" id="colsInput" value="4" min="1" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">垂直分割 (列)</label>
                        <input type="number" id="rowsInput" value="1" min="1" class="w-full px-3 py-2 border rounded-lg">
                    </div>
                </div>
            </div>
            <div class="p-6 bg-gray-50 flex justify-end gap-3">
                <button id="cancelSliceBtn" class="px-6 py-2 text-gray-500 font-medium">取消</button>
                <button id="confirmSliceBtn" class="px-6 py-2 bg-blue-600 text-white font-bold rounded-xl disabled:bg-gray-300" disabled>執行裁切並加入影格</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-xl opacity-0 transition-opacity pointer-events-none z-50"></div>

    <script>
        let frames = [];
        let generatedBlob = null;
        const LINE_MAX_WIDTH = 320;
        const LINE_MAX_HEIGHT = 270;

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const frameList = document.getElementById('frameList');
        const frameCountText = document.getElementById('frameCount');
        const generateBtn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultImage = document.getElementById('resultImage');
        const previewCard = document.getElementById('previewCard');
        const toast = document.getElementById('toast');
        
        // Modal elements
        const sliceModal = document.getElementById('sliceModal');
        const sliceInput = document.getElementById('sliceInput');
        const sliceTargetImg = document.getElementById('sliceTargetImg');
        const gridOverlay = document.getElementById('gridOverlay');
        const colsInput = document.getElementById('colsInput');
        const rowsInput = document.getElementById('rowsInput');
        const confirmSliceBtn = document.getElementById('confirmSliceBtn');

        // Handlers
        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('active'); };
        dropZone.ondragleave = () => dropZone.classList.remove('active');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            handleFiles(e.dataTransfer.files);
        };

        fileInput.onchange = (e) => handleFiles(e.target.files);

        document.getElementById('clearBtn').onclick = () => {
            frames = [];
            renderFrames();
            previewCard.classList.add('hidden');
        };

        // Modal Logic
        document.getElementById('sliceModeBtn').onclick = () => sliceModal.classList.remove('hidden');
        document.getElementById('closeModal').onclick = () => resetSliceModal();
        document.getElementById('cancelSliceBtn').onclick = () => resetSliceModal();
        document.getElementById('selectSliceFileBtn').onclick = () => sliceInput.click();

        sliceInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const dataUrl = await readFileAsDataURL(file);
            sliceTargetImg.src = dataUrl;
            document.getElementById('slicePreviewContainer').classList.remove('hidden');
            document.getElementById('selectSliceFileBtn').classList.add('hidden');
            confirmSliceBtn.disabled = false;
            updateGridOverlay();
        };

        [colsInput, rowsInput].forEach(input => input.oninput = updateGridOverlay);

        function updateGridOverlay() {
            if (!sliceTargetImg.complete) return;
            const cols = parseInt(colsInput.value) || 1;
            const rows = parseInt(rowsInput.value) || 1;
            
            gridOverlay.style.backgroundSize = `${100/cols}% ${100/rows}%`;
            gridOverlay.style.backgroundImage = `
                linear-gradient(to right, rgba(0,195,0,0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,195,0,0.3) 1px, transparent 1px)
            `;
        }

        function resetSliceModal() {
            sliceModal.classList.add('hidden');
            sliceInput.value = '';
            sliceTargetImg.src = '';
            document.getElementById('slicePreviewContainer').classList.add('hidden');
            document.getElementById('selectSliceFileBtn').classList.remove('hidden');
            confirmSliceBtn.disabled = true;
        }

        confirmSliceBtn.onclick = async () => {
            const cols = parseInt(colsInput.value) || 1;
            const rows = parseInt(rowsInput.value) || 1;
            const total = cols * rows;

            if (frames.length + total > 20) {
                showToast(`影格數將超過 20 張限制，請減少格數`);
                return;
            }

            const img = await loadImage(sliceTargetImg.src);
            const fw = img.width / cols;
            const fh = img.height / rows;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = fw;
            tempCanvas.height = fh;
            const tCtx = tempCanvas.getContext('2d');

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    tCtx.clearRect(0, 0, fw, fh);
                    tCtx.drawImage(img, c * fw, r * fh, fw, fh, 0, 0, fw, fh);
                    frames.push({
                        name: `Slice_${r+1}_${c+1}.png`,
                        url: tempCanvas.toDataURL('image/png'),
                        size: 0 // Estimated
                    });
                }
            }
            renderFrames();
            resetSliceModal();
            showToast(`成功裁切並加入 ${total} 個影格`);
        };

        // Core Functions
        function showToast(msg) {
            toast.innerText = msg;
            toast.style.opacity = "1";
            setTimeout(() => toast.style.opacity = "0", 3000);
        }

        async function handleFiles(files) {
            const pngFiles = Array.from(files).filter(f => f.type === 'image/png');
            if (pngFiles.length === 0) return showToast("請上傳 PNG 圖片");

            for (const file of pngFiles) {
                if (frames.length >= 20) break;
                const dataUrl = await readFileAsDataURL(file);
                frames.push({
                    name: file.name,
                    url: dataUrl,
                    size: file.size
                });
            }
            renderFrames();
        }

        function readFileAsDataURL(file) {
            return new Promise(r => {
                const reader = new FileReader();
                reader.onload = e => r(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        function renderFrames() {
            frameCountText.innerText = frames.length;
            frameList.innerHTML = frames.length ? '' : '<p class="text-center py-10 text-gray-400 italic">尚未上傳影格</p>';
            
            frames.forEach((frame, idx) => {
                const div = document.createElement('div');
                div.className = "flex items-center bg-white p-3 rounded-xl border border-gray-100 gap-4 shadow-sm group";
                div.innerHTML = `
                    <span class="text-xs font-bold text-gray-300 w-4">${idx + 1}</span>
                    <div class="w-12 h-12 bg-gray-50 rounded border flex items-center justify-center p-1">
                        <img src="${frame.url}" class="max-w-full max-h-full object-contain">
                    </div>
                    <div class="flex-1 truncate text-sm text-gray-600 font-medium">${frame.name}</div>
                    <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="removeFrame(${idx})" class="p-2 text-gray-400 hover:text-red-500 bg-gray-50 rounded-lg">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                `;
                frameList.appendChild(div);
            });
            updateDuration();
        }

        window.removeFrame = (idx) => {
            frames.splice(idx, 1);
            renderFrames();
        };

        function updateDuration() {
            const delay = parseInt(document.getElementById('frameDelay').value) || 0;
            const total = (frames.length * delay) / 1000;
            document.getElementById('totalDurationDisplay').innerText = total.toFixed(2);
            validateRules();
        }

        document.getElementById('frameDelay').oninput = updateDuration;

        function validateRules(finalSize = 0) {
            const count = frames.length;
            const delay = parseInt(document.getElementById('frameDelay').value) || 0;
            const totalSec = (count * delay) / 1000;
            
            const countRule = document.querySelector('[data-rule="count"]');
            const isCountOk = count >= 5 && count <= 20;
            updateRuleUI(countRule, isCountOk, `影格數：${count} (需 5-20)`);

            const timeRule = document.querySelector('[data-rule="time"]');
            const isTimeOk = [1, 2, 3, 4].includes(Math.round(totalSec * 10) / 10);
            updateRuleUI(timeRule, isTimeOk, `總時長：${totalSec.toFixed(1)}s (需為 1,2,3,4s)`);

            const sizeRule = document.querySelector('[data-rule="size"]');
            if (finalSize > 0) {
                const isSizeOk = (finalSize / 1024) <= 300;
                updateRuleUI(sizeRule, isSizeOk, `檔案大小：${(finalSize / 1024).toFixed(1)} KB`);
            }
        }

        function updateRuleUI(el, isValid, text) {
            el.className = `check-item flex items-center gap-2 ${isValid ? 'valid' : 'invalid'}`;
            el.querySelector('.status-icon').innerText = isValid ? '✅' : '❌';
            el.lastChild.textContent = ' ' + text;
        }

        async function generateAPNG() {
            if (frames.length < 5) return showToast("影格數不足 (至少 5 張)");
            
            const delay = parseInt(document.getElementById('frameDelay').value);
            const loops = parseInt(document.getElementById('loopCount').value);
            
            generateBtn.disabled = true;
            generateBtn.innerText = "正在處理中...";

            try {
                const imgs = await Promise.all(frames.map(f => loadImage(f.url)));
                const canvas = document.createElement('canvas');
                canvas.width = LINE_MAX_WIDTH;
                canvas.height = LINE_MAX_HEIGHT;
                const ctx = canvas.getContext('2d');

                const frameBuffers = imgs.map(img => {
                    ctx.clearRect(0, 0, LINE_MAX_WIDTH, LINE_MAX_HEIGHT);
                    let w = img.width;
                    let h = img.height;
                    const ratio = Math.min(LINE_MAX_WIDTH / w, LINE_MAX_HEIGHT / h);
                    w *= ratio;
                    h *= ratio;
                    ctx.drawImage(img, (LINE_MAX_WIDTH - w) / 2, (LINE_MAX_HEIGHT - h) / 2, w, h);
                    return ctx.getImageData(0, 0, LINE_MAX_WIDTH, LINE_MAX_HEIGHT).data.buffer;
                });

                const encoded = UPNG.encode(frameBuffers, LINE_MAX_WIDTH, LINE_MAX_HEIGHT, 0, Array(frames.length).fill(delay), loops);
                generatedBlob = new Blob([encoded], { type: 'image/png' });
                
                resultImage.src = URL.createObjectURL(generatedBlob);
                previewCard.classList.remove('hidden');
                document.getElementById('finalSize').innerText = `${(generatedBlob.size / 1024).toFixed(1)} KB`;
                
                validateRules(generatedBlob.size);
                showToast("產出成功！");
            } catch (err) {
                console.error(err);
                showToast("製作失敗");
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerText = "產生動畫並檢查";
            }
        }

        function loadImage(url) {
            return new Promise((r, j) => {
                const i = new Image();
                i.onload = () => r(i);
                i.onerror = j;
                i.src = url;
            });
        }

        generateBtn.onclick = generateAPNG;
        downloadBtn.onclick = () => {
            if (!generatedBlob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(generatedBlob);
            a.download = `line_sticker_${Date.now()}.png`;
            a.click();
        };
    </script>
</body>
</html>
