const timerEl = document.getElementById("timer");
const charCountEl = document.getElementById("charCount");
const wordCountEl = document.getElementById("wordCount");
const wordEl = document.getElementById("word");
const bopomofoEl = document.getElementById("bopomofo");
const typingInput = document.getElementById("typingInput");
const startBtn = document.getElementById("startBtn");
const soundBtn = document.getElementById("soundBtn");
const resetBtn = document.getElementById("resetBtn");

let currentWord = null;
let time = 60;
let charCount = 0;
let wordCount = 0;
let timerInterval = null;
let playing = false;

function pickWord(){
  currentWord = words[Math.floor(Math.random() * words.length)];
  wordEl.textContent = currentWord.word;
  bopomofoEl.textContent = currentWord.bopomofo;
  typingInput.value = "";
  typingInput.focus();
}

function speakWord(){
  if(!currentWord) return;

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(currentWord.word);
  speech.lang = "zh-TW";
  speech.rate = 0.8;
  speech.pitch = 1;

  window.speechSynthesis.speak(speech);
}

function getRank(count){
  if(count >= 90) return 98;
  if(count >= 75) return 92;
  if(count >= 60) return 86;
  if(count >= 45) return 78;
  if(count >= 30) return 68;
  if(count >= 20) return 58;
  if(count >= 10) return 48;
  return 35;
}

function getPraise(count){
  if(count >= 90) return "太厲害了！您的打字速度很有感覺！";
  if(count >= 75) return "非常棒！鍵盤越來越熟悉了！";
  if(count >= 60) return "很不錯喔！已經進入穩定練習狀態！";
  if(count >= 45) return "有進步！每天一分鐘會越來越順手！";
  if(count >= 30) return "很好，願意開始就是很棒的練習！";
  return "慢慢來沒關係，今天已經成功開始了！";
}

function finishGame(){
  playing = false;
  clearInterval(timerInterval);
  typingInput.disabled = true;

  const rank = getRank(charCount);
  const praise = getPraise(charCount);

  alert(
    "🎉 恭喜完成一分鐘練習！\n\n" +
    "本次打對：" + charCount + " 個字\n" +
    "完成題數：" + wordCount + " 題\n" +
    "贏過 " + rank + "% 的練習者！\n\n" +
    praise + "\n\n" +
    "💚 我們不用很厲害才開始，\n" +
    "只要開始就很厲害！"
  );
}

function startGame(){
  time = 60;
  charCount = 0;
  wordCount = 0;
  playing = true;

  timerEl.textContent = time;
  charCountEl.textContent = charCount;
  wordCountEl.textContent = wordCount;

  typingInput.disabled = false;
  pickWord();
  speakWord();

  clearInterval(timerInterval);

  timerInterval = setInterval(function(){
    time--;
    timerEl.textContent = time;

    if(time <= 0){
      finishGame();
    }
  }, 1000);
}

function resetGame(){
  playing = false;
  clearInterval(timerInterval);
  window.speechSynthesis.cancel();

  time = 60;
  charCount = 0;
  wordCount = 0;

  timerEl.textContent = 60;
  charCountEl.textContent = 0;
  wordCountEl.textContent = 0;

  wordEl.textContent = "準備開始";
  bopomofoEl.textContent = "按下開始練習";

  typingInput.value = "";
  typingInput.disabled = true;
}

typingInput.addEventListener("input", function(){

  if(!playing || !currentWord) return;

  const typedText = typingInput.value.trim();

  if(typedText === currentWord.word){

    charCount += currentWord.word.length;
    wordCount++;

    charCountEl.textContent = charCount;
    wordCountEl.textContent = wordCount;

    // 先清空
    typingInput.value = "";

    // 延遲一點再換題
    setTimeout(()=>{

      pickWord();
      speakWord();

    },100);

  }

});

startBtn.addEventListener("click", startGame);
resetBtn.addEventListener("click", resetGame);
soundBtn.addEventListener("click", speakWord);
